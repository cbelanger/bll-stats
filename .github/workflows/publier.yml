# Lance tools/extract.py sur GitHub et publie le site sur GitHub Pages.
# - Toute branche : vérification seulement (rien n'est importé ni publié).
# - Branche main : les PDF de pdf/ sont convertis en data/matchs/*.json et déplacés dans pdf/archives/
#   (commit « Import automatique des PDF » : faire Pull avant ton prochain push), puis le site est publié.
#   Un fichier en erreur est laissé de côté, les autres matchs sont publiés, et l'exécution finit
#   en échec pour que tu reçoives un courriel.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Extraire et publier

on:
  push:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: America/Toronto   # heure locale pour « genere_le » (bas de page du site)

jobs:
  extraire:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit de l'import des PDF
    outputs:
      code: ${{ steps.extract.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : date du dernier changement de code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Importer les PDF et extraire les matchs
        id: extract
        run: |
          arg=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then arg="--importer"; fi
          set +e
          python tools/extract.py $arg 2>&1 | tee "$RUNNER_TEMP/extract.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Extraction des matchs"
            echo '```'
            cat "$RUNNER_TEMP/extract.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f data/matchs.json ]; then
            echo "::error::data/matchs.json n'a pas été produit : rien n'est publié."
            exit 1
          fi

      - name: Enregistrer l'import des PDF
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain -- pdf data/matchs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- pdf data/matchs
            git commit -m "Import automatique des PDF"
            git push
            echo "::notice::PDF importés et archivés : faire Pull origin avant ton prochain push."
          fi

      - name: Date du dernier changement de code
        run: |
          d=$(git log -1 --format=%cI -- index.html css js assets)
          echo "{\"code\": \"$d\"}" > data/version.json

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: .

  deployer:
    needs: extraire
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

  verdict:
    # Après la publication : échec si au moins un PDF a été ignoré (déclenche le courriel de GitHub)
    needs: [extraire, deployer]
    if: always() && needs.extraire.result == 'success' && needs.extraire.outputs.code != '0'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Au moins un PDF a été ignoré. Voir le résumé de l'extraction ; les autres matchs sont publiés."
          exit 1
