<!doctype html>
<!-- Pilote de la vidéo d'aide (tools/video/faire_video.py) : rejoue la saisie jusqu'à l'étape ?etape=N,
     entoure ce qu'il faut toucher et affiche le sous-titre. Une capture d'écran par étape. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 360px; height: 640px; overflow: hidden; background: #16336B; }
  #ecran { display: block; width: 360px; height: 556px; border: 0; background: #F2F6FB; }
  #sous-titre {
    box-sizing: border-box; height: 84px; padding: 10px 16px; display: flex; align-items: center; justify-content: center;
    background: #16336B; color: #fff; border-top: 3px solid #D7192D; text-align: center;
    font: 600 18px/1.25 Barlow, "Segoe UI", sans-serif;
  }
  #sous-titre b { color: #F5C542; }
  .rond { position: absolute; pointer-events: none; border: 4px solid #F2B705; border-radius: 12px;
    box-shadow: 0 0 0 4px rgba(242, 183, 5, .35), 0 0 18px rgba(242, 183, 5, .8); }
  .doigt { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; pointer-events: none;
    background: rgba(242, 183, 5, .55); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
  #carte { position: absolute; left: 0; top: 0; width: 360px; height: 556px; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; box-sizing: border-box; background: #16336B; color: #fff; text-align: center; }
  #carte img { width: 140px; background: #fff; border-radius: 10px; padding: 8px; }
  #carte h1 { margin: 0; font: 700 34px/1.1 "Barlow Condensed", sans-serif; }
  #carte p { margin: 0; font: 500 19px/1.35 Barlow, sans-serif; color: #C9D6EE; }
  #carte p b { color: #fff; }
</style>
</head>
<body>
<iframe id="ecran" src="../../saisie.html"></iframe>
<div id="sous-titre"></div>
<div id="carte"></div>
<script>
const pause = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById("ecran");
const d = () => f.contentDocument;
const $ = s => d().querySelector(s);
const clic = s => $(s).click();
const taper = (s, v) => { const e = $(s); e.value = v; e.dispatchEvent(new Event("input", { bubbles: true })); };
// Toucher la patinoire à x %, y % du dessin (même calcul que placerLieu() de la saisie)
const pat = (x, y) => { const svg = $("#fb-pat svg"), r = svg.getBoundingClientRect();
  return { x: r.left + r.width * (6 + 8.5 * x) / 862, y: r.top + r.height * (6 + 7.5 * y) / 762, svg }; };

// Chaque étape : actions à rejouer (avant), ce qu'il faut toucher ensuite (cible), sous-titre.
// carte = écran de titre sans la saisie.
const ETAPES = [
  { carte: `<img src="../../assets/logo-bll.png" alt=""><h1>Saisir les stats<br>d'un match</h1><p>Sur ton téléphone, en 2 minutes</p>`,
    st: "Saisie de match – BLL Élite" },
  { cible: "#fi-adv", st: "Avant le match : inscris <b>l'adversaire</b>…" },
  { faire: () => taper("#fi-adv", "Équipe A"), cible: "#fi-gards [data-gd]", st: "…choisis <b>la gardienne</b>…" },
  { faire: () => { clic("#fi-gards [data-gd]"); $("#fi-resp").value = "Parent BLL"; }, cible: "#fi-resp", st: "…écris <b>ton nom</b>…" },
  { cible: '[data-act="infos-ok"]', st: "…puis <b>Enregistrer</b>." },
  { faire: () => clic('[data-act="infos-ok"]'), cible: '#periodes [data-p="p1"]', st: "Choisis <b>la période</b> en cours." },
  { cible: '.cote.nous [data-act="tir"]', st: "<b>+ Tir</b> à chaque tir cadré de notre équipe…" },
  { faire: () => { for (let i = 0; i < 3; i++) clic('.cote.nous [data-act="tir"]'); }, cible: '.cote.adv [data-act="tir"]', st: "…et de l'adversaire." },
  { faire: () => { clic('.cote.adv [data-act="tir"]'); clic('.cote.adv [data-act="tir"]'); }, cible: '[data-act="sz"][data-r="r"]',
    st: "Sortie de zone <b>réussie</b>…" },
  { faire: () => { clic('[data-act="sz"][data-r="r"]'); clic('[data-act="sz"][data-r="r"]'); }, cible: '[data-act="sz"][data-r="x"]', st: "…ou <b>ratée</b>." },
  { faire: () => clic('[data-act="sz"][data-r="x"]'), cible: '[data-act="but-nous"]', st: "Un but ? <b>+ But</b>. Il compte aussi un tir cadré." },
  { faire: () => clic('[data-act="but-nous"]'), cible: '[data-bs="AN"]',
    st: "Punition à l'adversaire ? <b>AN</b>. Sinon, rien : à égalité." },
  { faire: () => clic('[data-bs="AN"]'), cible: "#temps", st: "Temps au chrono : tape <b>845</b> pour 8:45." },
  { faire: () => taper("#temps", "845"), cible: '[data-bt="R"]', st: "Le <b>type de jeu</b>…" },
  { faire: () => clic('[data-bt="R"]'), cible: '[data-bz="HD"]', st: "…la <b>zone du filet</b>, vu de face…" },
  { faire: () => clic('[data-bz="HD"]'), toucher: () => pat(58, 32), st: "…et, si tu veux, <b>d'où part le but</b>." },
  { faire: () => { const p = pat(58, 32); p.svg.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: p.x, clientY: p.y })); },
    cible: '[data-act="but-ok"]', st: "<b>Enregistrer</b>." },
  { faire: () => clic('[data-act="but-ok"]'), cible: '#periodes [data-p="p2"]', st: "Nouvelle période ? Change-la en haut." },
  { faire: () => clic('#periodes [data-p="p2"]'), cible: '[data-act="but-adv"]', st: "But de l'adversaire : <b>+ But accordé</b>." },
  { faire: () => clic('[data-act="but-adv"]'), cible: '#f-but [data-act="fermer"]', st: "Pas le temps ? <b>Plus tard</b> : le but reste compté." },
  { faire: () => clic('#f-but [data-act="fermer"]'), cible: '.but.adv', st: "À l'arrêt de jeu, touche sa ligne pour le <b>compléter</b>." },
  { faire: () => { clic(".but.adv"); clic('[data-bt="L"]'); clic('[data-bz="BG"]'); }, cible: '[data-act="but-ok"]',
    st: "Complète, puis <b>Enregistrer</b>." },
  { faire: () => clic('[data-act="but-ok"]'), cible: "#annuler", st: "Une erreur ? <b>Annuler</b> défait la dernière action." },
  { cible: '[data-act="menu"]', st: "La gardienne est remplacée ? Ouvre le menu <b>☰</b>…" },
  { faire: () => clic('[data-act="menu"]'), cible: '[data-act="changement"]', st: "…puis <b>Changement de gardienne</b>." },
  { faire: () => clic('[data-act="changement"]'), cible: "#fc-gards [data-cg]", st: "Choisis la gardienne qui entre…" },
  { faire: () => clic("#fc-gards [data-cg]"), cible: "#fc-temps", st: "…tape le temps au chrono du changement…" },
  { faire: () => taper("#fc-temps", "500"), cible: '#f-chg [data-act="chg-ok"]',
    st: "…et <b>Enregistrer</b>. Les tirs reçus se partagent tout seuls." },
  { faire: () => clic('#f-chg [data-act="chg-ok"]'), cible: '[data-act="terminer"]', st: "À la fin du match : <b>Terminer</b>." },
  { faire: () => clic('[data-act="terminer"]'), cible: "#b-telecharger", st: "Vérifie le jaune, puis <b>Télécharger le fichier</b>." },
  { carte: `<h1>Dernière étape</h1><p>Envoie le fichier <b>.json</b> (dans Téléchargements) à <b>Christian</b>, par courriel ou texto.</p>
      <p>Une question ? Bouton <b>Aide</b> en haut de la saisie.</p>`, st: "C'est tout ! Merci 🙌" },
];

// Vidéo publique : les vrais noms des gardiennes (data/gardiennes.json) deviennent « Gardienne 1 », « Gardienne 2 »…
async function anonymiser() {
  const liste = (await (await fetch("../../data/gardiennes.json")).json()).gardiennes;
  const marche = d().createTreeWalker(d().body, NodeFilter.SHOW_TEXT);
  for (let n; (n = marche.nextNode());)
    liste.forEach((g, i) => { if (n.nodeValue.includes(g.nom)) n.nodeValue = n.nodeValue.split(`${g.nom} #${g.numero}`).join(`Gardienne ${i % 2 + 1} #${i % 2 + 1}`).split(g.nom).join(`Gardienne ${i % 2 + 1}`); });
}

async function jouer() {
  const n = Number(new URLSearchParams(location.search).get("etape") || 0);
  const e = ETAPES[n];
  document.getElementById("sous-titre").innerHTML = `<span>${e.st}</span>`;
  if (e.carte) { const c = document.getElementById("carte"); c.innerHTML = e.carte; c.style.display = "flex"; }
  await pause(2200);   // chargement de la saisie et de la liste des gardiennes
  await d().fonts.ready; await document.fonts.ready;   // polices chargées : sinon le texte bouge après la mesure
  for (let i = 1; i <= n; i++) {
    if (ETAPES[i].faire) { ETAPES[i].faire(); await pause(120); }
  }
  await pause(300);
  await anonymiser();
  // scrollIntoView fait aussi défiler cette page-ci (le cadre) : la remettre en haut, sinon le rond est décalé
  const vue = e.cible || (e.toucher && "#fb-pat");
  if (vue) { $(vue).scrollIntoView({ block: "center", behavior: "instant" }); window.scrollTo(0, 0); await pause(500); }
  // Rond et doigt placés, puis replacés juste avant la capture (la page peut encore bouger un peu)
  const k = document.createElement("div"), g = document.createElement("div");
  k.className = "rond"; g.className = "doigt";
  const placer = () => {
    window.scrollTo(0, 0);
    const o = f.getBoundingClientRect();
    let x, y, r;
    if (e.toucher) ({ x, y } = e.toucher());
    else if (e.cible) { r = $(e.cible).getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    if (x == null) return;
    if (r) { Object.assign(k.style, { left: o.left + r.left - 6 + "px", top: o.top + r.top - 6 + "px", width: r.width + 4 + "px", height: r.height + 4 + "px" });
      document.body.append(k); }
    Object.assign(g.style, { left: o.left + x + "px", top: o.top + y + "px" }); document.body.append(g);
  };
  placer();
  for (let i = 0; i < 6; i++) { await pause(500); await anonymiser(); placer(); }
  document.title = "PRET " + ETAPES.length;
}
f.addEventListener("load", jouer);
</script>
</body>
</html>
