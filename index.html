<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLL Élite – Statistiques</title>
  <!-- Aperçu du lien (Messenger, courriel…) ; image : tools/generer_apercu.py -->
  <meta name="description" content="Statistiques de match des équipes U16AA et U19AA du BLL Élite (ringuette).">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cbelanger.github.io/bll-stats/">
  <meta property="og:title" content="BLL Élite – Statistiques">
  <meta property="og:description" content="Matchs, gardiennes, équipe et adversaires : U16AA et U19AA.">
  <meta property="og:image" content="https://cbelanger.github.io/bll-stats/assets/apercu.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/logo-bll.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Thème appliqué avant l'affichage : choix du bouton du bandeau (localStorage), sinon réglage de l'appareil
    (function () {
      var c = null; try { c = localStorage.getItem("bll-theme"); } catch (e) { /* stockage bloqué */ }
      document.documentElement.classList.toggle("sombre", c ? c === "sombre" : matchMedia("(prefers-color-scheme: dark)").matches);
    })();
  </script>
</head>
<body>
  <header class="barre">
    <a class="marque" href="#/matchs">
      <img src="assets/logo-bll.png" alt="BLL Élite">
      <span>Statistiques</span>
    </a>
    <nav class="onglets" aria-label="Sections">
      <a href="#/matchs" data-vue="matchs">Matchs</a>
      <a href="#/gardiennes" data-vue="gardiennes">Gardiennes</a>
      <a href="#/equipe" data-vue="equipe">Équipe</a>
      <a href="#/adversaires" data-vue="adversaires">Adversaires</a>
      <a href="aide.html?depuis=site">Aide</a>
    </nav>
    <div class="filtres">
      <label>Saison <select id="f-saison"></select></label>
      <div class="bascule" role="group" aria-label="Équipe">
        <button type="button" data-equipe="U19AA">U19AA</button>
        <button type="button" data-equipe="U16AA">U16AA</button>
      </div>
      <button type="button" class="theme" id="theme" aria-label="Mode sombre">
        <svg class="lune" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="soleil" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
    </div>
  </header>

  <main id="contenu" tabindex="-1">
    <p class="vide">Chargement des matchs…</p>
  </main>

  <footer class="pied">
    <span id="version"></span>
    <span id="maj"></span>
    <span>Réalisation : Christian Bélanger · Code sous licence MIT</span>
  </footer>

  <script src="js/patinoire.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
